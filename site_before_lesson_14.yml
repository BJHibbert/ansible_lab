---
- hosts: all
  become: true
  pre_tasks:

  - name: Install updates for Fedora
    tags: always
    ansible.builtin.dnf:
      name: "*"
      state: latest
      update_cache: yes
    when: ansible_facts['os_family'] == "RedHat"

  - name: Install packages for Fedora
    tags: always
    ansible.builtin.dnf:
      name:
        - fastfetch
        - nano
      state: latest
    when: ansible_facts['os_family'] == "RedHat"

  - name: Install updates for Debian
    tags: always
    ansible.builtin.apt:
      update_cache: yes
      upgrade: dist
    when: ansible_facts['os_family'] == "Debian"

  - name: Install packages for Debian
    tags: always
    ansible.builtin.apt:
      name:
        - fastfetch
        - vim
      state: latest
    when: ansible_facts['os_family'] == "Debian"

  - name: create user ansible
    tags: always
    ansible.builtin.user:
      name: ansible
      shell: /bin/bash
      groups: root

  - name: Add sudoers file for ansible
    tags: always
    ansible.builtin.copy:
      src: sudoer_ansible
      dest: /etc/sudoers.d/ansible
      owner: root
      group: root
      mode: 0440

  - name: add authorized key for ansible
    tags: always
    ansible.builtin.authorized_key:
      user: ansible
      key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKFM7jdkwWE920yK2+lGHfQnYisSxKfSkSxpLKpPM7mb bjh-ansible"

- hosts: fastfetch
  become: true
  tasks:

  - name: Ensure fastfetch exists in .bashrc
    ansible.builtin.lineinfile:
      path: /home/bjhibbert/.bashrc
      regexp: '^fastfetch'
      line: 'fastfetch'
      insertafter: EO

- hosts: web_servers
  become: true
  tasks:

  - name: Install apache on debian web servers
    tags: apache
    ansible.builtin.apt:
      name:
        - apache2
        - libapache2-mod-php
      state: latest
    when: ansible_facts['os_family'] == "Debian"

  - name: Install apache on fedora web servers
    tags: apache
    ansible.builtin.dnf:
      name:
        - httpd
        - php
      state: latest
    when: ansible_facts['os_family'] == "RedHat"

  - name: ensure apache is running (debian)
    tags: apache
    ansible.builtin.service:
      name: apache2
      state: started
    when: ansible_facts['os_family'] == "Debian"

  - name: ensure apache is running (Fedora)
    tags: apache
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: true
    when: ansible_facts['os_family'] == "RedHat"

  - name: Change email address for apache admin (Fedora)
    tags: apache
    ansible.builtin.lineinfile:
      path: /etc/httpd/conf/httpd.conf
      regexp: '^ServerAdmin'
      line: ServerAdmin 2Hot@yourdomain.tld
    register: httpd_serveradmin
    when: ansible_facts['os_family'] == "RedHat"

  - name: restart httpd service (Fedora)
    tags: apache,fedora
    ansible.builtin.service:
      name: httpd
      state: restarted
      enabled: true
    when: httpd_serveradmin.changed

  - name: copy default html file for web site
    tags: apache
    ansible.builtin.copy:
      src: default_site.html
      dest: /var/www/html/index.html
      owner: root
      group: root
      mode: 0644

  - name: Configure firewalld (RedHat)
    tags: apache,fedora
    ansible.posix.firewalld:
      service: http
      permanent: true
      immediate: true
      state: enabled
    when: ansible_facts['os_family'] == "RedHat"
