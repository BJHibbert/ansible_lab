- name: Install apache on web servers
  tags: apache
  ansible.builtin.package:
    name: "{{ apache_package }}"
    state: latest

- name: ensure apache is running on web servers
  tags: apache
  ansible.builtin.service:
    name: "{{ apache_service }}"
    state: started

- name: Change email address for apache admin (Fedora)
  tags: apache
  ansible.builtin.lineinfile:
    path: /etc/httpd/conf/httpd.conf
    regexp: '^ServerAdmin'
    line: ServerAdmin SugarBooty@yourdomain.tld
  notify: restart_apache
  when: ansible_facts['os_family'] == "RedHat"

- name: copy default html file for web site
  tags: apache
  ansible.builtin.copy:
    src: default_site.html
    dest: /var/www/html/index.html
    owner: root
    group: root
    mode: 0644

- name: Configure firewalld (RedHat)
  tags: apache,fedora
  ansible.posix.firewalld:
    service: http
    permanent: true
    immediate: true
    state: enabled
  when: ansible_facts['os_family'] == "RedHat"
