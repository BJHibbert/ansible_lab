---
- hosts: all
  become: true
  tasks:

  - name: update apt repository index
    ansible.builtin.apt:
      update_cache: yes
      upgrade: dist
    when: ansible_facts['os_family'] == "Debian"

  - name: install apache2 package
    ansible.builtin.apt:
      name: apache2
      state: latest
    when: ansible_facts['os_family'] == "Debian"

  - name: install php support for apache2
    ansible.builtin.apt:
      name: libapache2-mod-php
      state: latest
    when: ansible_facts['os_family'] == "Debian"

  - name: update dnf repository index
    ansible.builtin.dnf:
      update_cache: yes
    when: ansible_facts['os_family'] == "RedHat"

  - name: install httpd package
    ansible.builtin.dnf:
      name: httpd
      state: latest
    when: ansible_facts['os_family'] == "RedHat"

  - name: install php support for httpd
    ansible.builtin.dnf:
      name: php
      state: latest
    when: ansible_facts['os_family'] == "RedHat"
