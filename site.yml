---
- hosts: all
  become: true
  pre_tasks:

  - name: Install updates for Fedora
    tags: always
    ansible.builtin.dnf:
      name: "*"
      state: latest
      update_cache: yes
    when: ansible_facts['os_family'] == "RedHat"

  - name: Install updates for Debian
    tags: always
    ansible.builtin.apt:
      update_cache: yes
      upgrade: dist
    when: ansible_facts['os_family'] == "Debian"

- hosts: all
  become: true
  roles:
    - base

- hosts: fastfetch
  become: true
  roles:
    - fastfetch

- hosts: web_servers
  become: true
  roles:
    - web_servers

